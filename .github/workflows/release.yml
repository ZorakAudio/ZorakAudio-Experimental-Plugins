name: Build & Release

on:
  push:
    branches: ['**']
    tags: ['v*', 'R*']
  pull_request: {}
  workflow_dispatch:
    inputs:
      full_catalog:
        description: Build every catalog plugin (otherwise build the five CI examples)
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  CMAKE_BUILD_PARALLEL_LEVEL: '2'
  BUILD_TAG: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('ci-{0}', github.run_number) }}
  CATALOG_SCOPE: ${{ (startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && inputs.full_catalog)) && 'full' || 'smoke' }}

jobs:
  build:
    name: Catalog (${{ matrix.os }}, group ${{ matrix.shard }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 330
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-24.04]
        shard: ${{ fromJSON((startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && inputs.full_catalog)) && '[0,1,2,3]' || '[0]') }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false
      - name: Prepare toolchain and patched host wrappers
        uses: ./.github/actions/setup-build
      - name: Dependency patch and packaging contract tests
        run: |
          python tests/build/test_wrapper_patches.py
          python tests/build/test_catalog_merge.py
          python scripts/check_plugin_readmes.py
      - name: Compiler, deferred-worker and idle IPC contracts
        if: matrix.shard == 0
        run: |
          python tests/tasks/test_tasks.py
          python tests/runtime/test_performance_contracts.py
          python tests/tasks/test_corpus_matrix.py
      - name: Configure universal2 macOS catalog
        if: runner.os == 'macOS'
        shell: bash
        run: |
          echo 'CMAKE_OSX_ARCHITECTURES=arm64;x86_64' >> "$GITHUB_ENV"
          echo 'CMAKE_OSX_DEPLOYMENT_TARGET=11.0' >> "$GITHUB_ENV"
          echo 'MACOSX_DEPLOYMENT_TARGET=11.0' >> "$GITHUB_ENV"
      - name: Build and package VST3 + CLAP
        shell: python
        run: |
          import os, subprocess, sys
          flags = [] if os.environ['CATALOG_SCOPE'] == 'full' else ['--smoke']
          if os.environ['CATALOG_SCOPE'] == 'full':
              flags += ['--shard', '${{ matrix.shard }}/4']
          subprocess.check_call([sys.executable, '-u', 'scripts/build.py',
              '--config', 'Release', '--tag', os.environ['BUILD_TAG'], '--out', 'dist', *flags])
      - name: Verify applied dependency patches
        run: python tools/jit_editor/apply_wrapper_patches.py --check
      - name: Verify macOS architectures and signatures
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' bundle; do
            codesign --verify --deep --strict "$bundle"
            while IFS= read -r -d '' binary; do
              lipo "$binary" -verify_arch arm64 x86_64
            done < <(find "$bundle/Contents/MacOS" -type f -print0)
          done < <(find dist -type d \( -name '*.vst3' -o -name '*.clap' \) -print0)
      - name: Upload catalog archives
        uses: actions/upload-artifact@v4
        with:
          name: catalog-${{ runner.os }}-${{ matrix.shard }}
          path: dist/**/*.zip
          if-no-files-found: error
      - name: Upload compiler diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: diagnostics-catalog-${{ runner.os }}-${{ matrix.shard }}
          path: build/ci
          if-no-files-found: ignore

  jit_editor:
    name: JIT Editor (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-24.04]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false
      - name: Prepare toolchain and patched host wrappers
        uses: ./.github/actions/setup-build
      - name: Build, package and qualify the standalone editor
        shell: python
        run: |
          import os, subprocess, sys
          command = [sys.executable, '-u', 'scripts/ci_jit_editor.py', '--output', 'dist/jit-editor']
          if os.environ['RUNNER_OS'] == 'Linux':
              command = ['xvfb-run', '-a', *command]
          subprocess.check_call(command)
      - name: Verify applied dependency patches
        run: python tools/jit_editor/apply_wrapper_patches.py --check
      - name: Upload usable JIT Editor archives
        uses: actions/upload-artifact@v4
        with:
          name: jit-editor-${{ runner.os }}
          path: |
            dist/jit-editor/*.zip
            dist/jit-editor/*.tar.gz
          if-no-files-found: error
      - name: Upload JIT qualification logs and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jit-editor-diagnostics-${{ runner.os }}
          path: |
            build/ci/environment.json
            build/ci/jit-editor
          if-no-files-found: ignore

  release:
    name: Publish tagged release
    needs: [build, jit_editor]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@v4
        with:
          pattern: catalog-*
          path: build/catalog-shards
      - name: Assemble complete catalogs and verify all plugins are present
        env:
          TAG: ${{ github.ref_name }}
        run: python scripts/merge_catalog_archives.py --input build/catalog-shards --output dist/catalog --tag "$TAG"
      - uses: actions/download-artifact@v4
        with:
          name: jit-editor-Windows
          path: dist/jit-editor
      - uses: actions/download-artifact@v4
        with:
          name: jit-editor-Linux
          path: dist/jit-editor
      - name: Publish archives after every build and qualification gate passes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          shopt -s globstar nullglob
          if [[ "$TAG" == R* ]]; then
            gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --generate-notes
          else
            gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --generate-notes --prerelease
          fi
          files=(dist/catalog/**/ZorakAudio-Experimental-Plugins-"$TAG"-*.zip dist/jit-editor/*.zip dist/jit-editor/*.tar.gz)
          if [[ ${#files[@]} -ne 7 ]]; then
            echo 'Expected three catalog archives and four Windows/Linux JIT Editor archives'
            exit 2
          fi
          for attempt in 1 2 3; do
            if gh release upload "$TAG" "${files[@]}" --clobber; then
              exit 0
            fi
            sleep 2
          done
          exit 1
